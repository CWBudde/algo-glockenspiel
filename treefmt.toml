# treefmt configuration for algo-glockenspiel
# Multi-language code formatting

[global]
excludes = [
    # Git and version control
    "**/.gitignore",
    "**/.git/**",

    # Go module files (managed by go tooling)
    "go.sum",
    "go.mod",

    # Documentation and text files
    "**/*.txt",
    "CHANGELOG.md",
    "LICENSE",

    # Binary and data files
    "**/*.wav",
    "**/*.pdf",
    "**/*.png",
    "**/*.jpg",
    "**/*.jpeg",

    # Build artifacts
    "bin/**",
    "dist/**",
    "web/dist/**",
    "web/node_modules/**",
    "web/wasm_exec.js",
    "*.test",
    "coverage.out",
    "coverage.html",
]

# Go formatter - simple and strict
[formatter.gofumpt]
command = "gofumpt"
options = ["-w"]
includes = ["*.go"]

# Go import organizer - runs after gofumpt
[formatter.gci]
command = "gci"
options = ["write"]
includes = ["*.go"]
priority = 1

# Shell script checker
[formatter.shellcheck]
command = "shellcheck"
includes = ["*.sh"]

# Shell script formatter - runs after shellcheck
[formatter.shfmt]
command = "shfmt"
options = ["-s", "-w"]
includes = ["*.sh"]
priority = 1

# Markdown, YAML, JSON formatter
#
# Pinned to the exact version CI checks against. treefmt otherwise calls
# whatever `prettier` is on PATH, and prettier's minor releases do change
# formatting -- 3.9 wraps multi-line type unions differently from 3.8 -- so an
# unpinned local formatter and a pinned CI check disagree about a correctly
# formatted tree. Bump this and .github/workflows/test-format.yaml together,
# then run `just fmt` in the same commit.
[formatter.prettier]
command = "npx"
options = ["--yes", "prettier@3.8.0", "-w"]
includes = [
    "*.md",
    "*.yaml",
    "*.yml",
    "*.json",
    "*.js",
    "*.ts",
    "*.tsx",
    "*.css",
    "*.html",
]
excludes = [
    # Exclude potentially sensitive or auto-generated files
    "**/*.sops.*",
]
