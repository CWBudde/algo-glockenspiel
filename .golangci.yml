version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - thelper
    - tparallel
    - unused
    - varnamelen
    - wsl_v5

    - revive
  settings:
    varnamelen:
      # DSP code reads better with short, conventional names: Chebyshev
      # recurrence terms (t0..t2), biquad coefficients (a1, b0..b2), quadrature
      # state (re, im), and windowed buffers (aw, bw). Renaming them to satisfy
      # a length rule makes the maths harder to follow, not easier.
      max-distance: 20
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-decls:
        - i int
        - n int
        - s string
        - b []byte
        - w io.Writer
        - r io.Reader
        - t testing.T
        - b testing.B
      ignore-names:
        - a
        - o
        - p
        - v
        - x
        - cp
        - re
        - im
        - aw
        - bw
        - b
        - r
        - t
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 1500
              skip-comments: false
              skip-blank-lines: false
  exclusions:
    presets: []

formatters:
  enable:
    - gofumpt
    - gci
