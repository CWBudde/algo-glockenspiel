<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Algo Glockenspiel</title>
    <meta
      name="description"
      content="Play the physical-model glockenspiel in your browser with a piano-aligned instrument view."
    />
  </head>
  <body data-ui-surface="web">
    <div id="root"></div>

    <!--
      wasm_exec.js is vendored from the Go toolchain and must stay
      byte-identical to it -- scripts/build-wasm.sh refuses to build when it
      drifts, because the shim and the module share an ABI. It is therefore a
      classic script rather than a module import: nothing bundles it, nothing
      transforms it, and it publishes the `Go` constructor the app expects to
      find before it starts.
    -->
    <script src="./wasm_exec.js"></script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
