<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Algo Glockenspiel</title>
    <meta
      name="description"
      content="Play the physical-model glockenspiel in your browser with a piano-aligned instrument view."
    />
  </head>
  <body data-ui-surface="web">
    <script>
      /*
        The theme, before the first paint.

        The stylesheet reads data-theme off <html>, and the bundle only gets to
        write it once the module has loaded and React has mounted -- long
        enough for a dark visitor to be shown a full-brightness page and then
        have it swapped underneath them. This does the same read the switch
        does, inline and blocking, so the first paint is already right.

        The key and the three values are src/lib/theme.ts's; the assertion that
        they still agree is in src/lib/theme.test.ts.
      */
      try {
        var theme = localStorage.getItem("algo-glockenspiel:theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (error) {
        // Blocked site data means the visitor gets the system preference,
        // which is what "auto" would have given them anyway.
      }
    </script>

    <div id="root"></div>

    <!--
      wasm_exec.js is not loaded here. The Go module runs in the engine worker
      (src/audio/engine.worker.ts), which imports the shim for its side effect,
      so the page itself never starts a Go runtime. The file is still shipped
      beside the bundle -- the worker fetches it by URL, and it must stay
      byte-identical to the Go toolchain's copy, which scripts/build-wasm.sh
      enforces.
    -->
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
