<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Algo Glockenspiel</title>
    <meta
      name="description"
      content="Play the physical-model glockenspiel in your browser with a piano-aligned instrument view."
    />
  </head>
  <body data-ui-surface="web">
    <div id="root"></div>

    <!--
      wasm_exec.js is not loaded here. The Go module runs in the engine worker
      (src/audio/engine.worker.ts), which imports the shim for its side effect,
      so the page itself never starts a Go runtime. The file is still shipped
      beside the bundle -- the worker fetches it by URL, and it must stay
      byte-identical to the Go toolchain's copy, which scripts/build-wasm.sh
      enforces.
    -->
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
