name: test-can-build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  can-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go-Version
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check module tidiness
        # `-diff` reports what tidying would change and exits non-zero without
        # rewriting the tree. It could not run while `go.mod` carried a
        # `replace` directive pointing at a sibling checkout no runner has.
        run: go mod tidy -diff

      - name: Build all packages
        run: go build ./...

      - name: Vet
        run: go vet ./...
