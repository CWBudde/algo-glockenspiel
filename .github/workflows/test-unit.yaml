name: test-unit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-unit:
    # arm64 is not redundant here: the AVX2 kernels compile out on it, so this
    # is the only job that exercises the non-amd64 fallback paths. It is also
    # where the NEON kernels will be verified.
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go-Version
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -race ./...
