name: test-web

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly what the lock
      # file pins and fails on a lock file that disagrees with package.json,
      # which is the point of running it in CI at all.
      - name: Install dependencies
        run: npm --prefix web ci

      - name: Typecheck
        run: npm --prefix web run typecheck

      - name: Lint
        run: npm --prefix web run lint

      # The audio transport's pure core -- the queue the AudioWorklet and the
      # ScriptProcessorNode fallback both drain, and the module URL the engine
      # worker resolves. Everything around them needs a real audio thread.
      - name: Test
        run: npm --prefix web run test

      # The build is a check in its own right: tsc does not see the CSS, the
      # asset imports or the HTML entry, and any of the three can break a bundle
      # that typechecks cleanly.
      - name: Build
        run: npm --prefix web run build

  test-web-visual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Test visual baseline
        run: npm run test:visual
        working-directory: web

      - name: Upload visual failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-failure
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7
