name: Deploy Web Demo

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "assets/**"
      - "cmd/glockenspiel-wasm/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      # model/ was moved out of internal/ and is the DSP core the WASM demo
      # pulls in transitively through cmd/glockenspiel-wasm. Without this entry
      # a change to the entire synthesis core -- bar, modes, excitation -- left
      # the published demo running the previous build, with nothing failing to
      # signal it.
      - "model/**"
      - "scripts/build-wasm.sh"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The build script treats wasm-opt as optional, so this step only decides
      # whether the deployed module is 3.21 MB or 3.40 MB; it never decides
      # whether the build succeeds. It is installed here and not in test-wasm
      # because size only matters for what users actually download.
      - name: Install binaryen
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build web demo
        run: ./scripts/build-wasm.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
