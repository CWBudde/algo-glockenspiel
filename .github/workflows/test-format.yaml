name: test-format

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go-Version
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        # Install the prebuilt binary rather than `go install`: recent
        # golangci-lint releases require a newer Go than go.mod pins, and
        # setup-go sets GOTOOLCHAIN=local, so building it from source fails.
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh |
            sh -s -- -b "$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

      - name: Check Go formatting
        # `fmt --diff` reports what the formatters would change and exits
        # non-zero, without rewriting the tree.
        run: golangci-lint fmt --diff

      - name: Check web formatting
        # Pinned to an exact version, and to the same one treefmt.toml's
        # prettier formatter runs locally. `prettier@3` floats to the newest
        # 3.x, and prettier's minor releases do change formatting -- 3.9 wraps
        # multi-line type unions differently from 3.8 -- so a floating range
        # turns "formatted correctly" into a question of which day CI ran.
        # The failure mode is worse than a stale pin: the tree is formatted,
        # `just fmt` reports nothing to do, and CI fails anyway on files the
        # developer cannot reformat without breaking their own check.
        # Upgrading is deliberate: bump this and the local toolchain together,
        # then run `just fmt` in the same commit.
        run: npx --yes prettier@3.8.0 --check "web/**/*.{js,ts,tsx,css,html}" "plugin/**/ui/*.{js,html}"
